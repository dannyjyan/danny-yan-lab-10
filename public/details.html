<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Movie Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light py-4">
  <div class="container">
    <h1 class="mb-4">🎞️ Movie Details</h1>

    <div id="details" class="card p-4 shadow-sm mb-4">
      Loading...

      <!-- Buttons will be injected by details.js -->
      <div id="movieActions" class="mt-3 d-flex gap-2">
        <button id="editBtn" class="btn btn-primary btn-sm">✏️ Edit</button>
        <button id="deleteBtn" class="btn btn-danger btn-sm">🗑️ Delete</button>
      </div>
    </div>

    <div id="reviews" class="card p-4 shadow-sm mb-4">
      <h4 class="mb-3">📝 Reviews</h4>
      <div id="reviewList">Loading reviews...</div>
    </div>

    <a href="manager.html" class="btn btn-secondary">← Back to Movie List</a>
  </div>

  <script src="details.js"></script>
</body>

</html>

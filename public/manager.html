<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Movie Manager (Online)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light py-4">
  <div class="container">
    <h1 class="mb-4">Movie Manager (Online)</h1>

    <!-- Movie Table -->
    <div class="table-responsive mb-5">
      <table class="table table-striped table-bordered align-middle" id="movieTable">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Genre</th>
            <th>Rating</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Collapsible Add Movie Form -->
    <div class="accordion mb-5" id="movieAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingAddMovie">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseAddMovie" aria-expanded="false" aria-controls="collapseAddMovie">
            ➕ Add a New Movie
          </button>
        </h2>
        <div id="collapseAddMovie" class="accordion-collapse collapse" aria-labelledby="headingAddMovie"
          data-bs-parent="#movieAccordion">
          <div class="accordion-body">
            <form id="addMovieForm">
              <div class="mb-3">
                <label for="newName" class="form-label">Name</label>
                <input type="text" id="newName" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="newGenre" class="form-label">Genre</label>
                <input type="text" id="newGenre" class="form-control" required />
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-primary">Add Movie</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (for collapse to work) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="manager.js"></script>
</body>

</html>
